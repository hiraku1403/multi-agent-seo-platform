[project]
name = "multi-agent-seo-platform"
version = "0.1.0"
description = "Plataforma de SEO Multi-Agente"
requires-python = ">=3.12"
dependencies = [
    "crewai==0.5.0",
    "langchain==0.1.0",
    "langchain-openai==0.0.2",
    "openai==1.7.1",
    "langgraph==0.0.20",
    "fastapi==0.104.1",
    "uvicorn==0.24.0",
    "python-dotenv==1.0.0",
    "requests==2.31.0",
    "python-multipart==0.0.6",
    "beautifulsoup4==4.12.2",
    "selenium==4.16.0",
    "tavily-python==0.5.0",
    "jinja2==3.1.2",
    "pydantic==2.5.0",
    "python-jose==3.3.0"
]

[tool.vercel]
entrypoint = "src.api.app:app"
